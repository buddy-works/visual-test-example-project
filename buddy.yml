- pipeline: "Run tests"
  on: "CLICK"
  refs:
    - "refs/heads/main"
  fail_on_prepare_env_warning: true
  actions:
    - action: "Install packages"
      type: "BUILD"
      docker_image_name: "library/node"
      docker_image_tag: "22"
      execute_commands:
        - "pnpm i --no-frozen-lockfile"
        - "npx cypress install --force"
      setup_commands:
        - "npm i pnpm -g"
      volume_mappings:
        - "/:/buddy/visual-test-example-project"
        - "/root/.cache/Cypress:/root/.cache/Cypress"
      shell: "BASH"
    - action: "Run tests"
      type: "BUILD"
      docker_image_name: "library/node"
      docker_image_tag: "22"
      execute_commands:
        - "export CYPRESS_CACHE_FOLDER=$(pwd)/root/.cache/Cypress"
        - "npm run test-ci"
      setup_commands:
        - "#BEGIN INSTALL BUDDY CLI"
        - "if command -v apt-get > /dev/null 2>&1; then apt-get update && apt-get install -y software-properties-common && gpg --homedir /tmp --no-default-keyring --keyring /usr/share/keyrings/buddy.gpg --keyserver hkp://keyserver.ubuntu.com:80 --recv-keys eb39332e766364ca6220e8dc631c5a16310cc0ad && echo \"deb [arch=amd64 signed-by=/usr/share/keyrings/buddy.gpg] https://es.buddy.works/bdy/apt-repo prod main\" | tee /etc/apt/sources.list.d/buddy.list > /dev/null && apt-get update && apt-get install -y bdy; else echo \"Error: apt-get not found. This installation method requires a Debian/Ubuntu-based system.\" && exit 1; fi"
        - "#END INSTALL BUDDY CLI"
        - "#BEGIN INSTALL BROWSER"
        - bdy visual install-browser
        - "#END INSTALL BROWSER"
        - "#BEGIN INSTALL BROWSER DEPENDENCIES"
        - apt-get install -y ca-certificates fonts-liberation libasound2 libatk-bridge2.0-0 libatk1.0-0 libc6 libcairo2 libcups2 libdbus-1-3 libexpat1 libfontconfig1 libgbm1 libgcc1 libglib2.0-0 libgtk-3-0 libnspr4 libnss3 libpango-1.0-0 libpangocairo-1.0-0 libstdc++6 libx11-6 libx11-xcb1 libxcb1 libxcomposite1 libxcursor1 libxdamage1 libxext6 libxfixes3 libxi6 libxrandr2 libxrender1 libxss1 libxtst6 lsb-release wget xdg-utils
        - "#END INSTALL BROWSER DEPENDENCIES"
        - "#BEGIN INSTALL CYPRESS DEPENDENCIES"
        - apt-get install -y xvfb
        - "#END INSTALL CYPRESS DEPENDENCIES"
      shell: "BASH"
      vt_suite: my_first_suite
